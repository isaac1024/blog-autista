framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # The salt of the day the visits to the site are counted with. It
            # lives in Redis, never in the database nor its backups, and
            # expires shortly after the day it belongs to.
            web.visit_salt.cache:
                adapter: cache.adapter.redis
            # How many visits each reader has sent of late, for the limiter
            # that keeps the counts from being flooded.
            web.visit_limiter.cache:
                adapter: cache.adapter.redis

when@test:
    services:
        # Kept in memory like cache.adapter.array, but never reset between the
        # requests of one kernel: Redis keeps them across requests, and the
        # salt of the day and the limiter rely on it. Each kernel starts empty.
        web.test.cache.adapter.memory:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter
            abstract: true
            arguments: [0, false]
            tags:
                - { name: cache.pool, clearer: cache.default_clearer }

    framework:
        cache:
            pools:
                web.visit_salt.cache:
                    adapter: web.test.cache.adapter.memory
                web.visit_limiter.cache:
                    adapter: web.test.cache.adapter.memory
