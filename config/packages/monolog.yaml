monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# On the hosting, what PHP writes to stderr reaches no file of the account,
# and the cron throws the output of its consumers away: the logs are files
# in var/log, kept between deploys, two weeks of each, for a finite disk.
# Nothing here logs a reader's address.
when@prod:
    monolog:
        handlers:
            # A request or a command that fails writes what led to it.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!messenger"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # A warning, such as proxies left untrusted, is written alone.
            warnings:
                type: filter
                min_level: warning
                max_level: warning
                handler: nested
                channels: ["!deprecation", "!messenger"]
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 14
            # The consumers of the cron: a message that failed, retried or
            # went to the failed transport.
            messenger:
                type: rotating_file
                path: "%kernel.logs_dir%/messenger.log"
                level: warning
                channels: [messenger]
                max_files: 14
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
