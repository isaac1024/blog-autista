security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # The CMS context has a single administrator loaded from environment
    # variables by the provider below.
    providers:
        cms_user_provider:
            id: Cms\Authentication\Infrastructure\Security\AdministratorUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        cms:
            # Only requests addressed to the CMS host are authenticated.
            host: '^%env(CMS_HOST)%$'
            provider: cms_user_provider
            lazy: true
            form_login:
                login_path: cms_login
                check_path: cms_login_check
                default_target_path: cms_pages
                enable_csrf: true
            logout:
                path: cms_logout
                target: cms_login
        main:
            lazy: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # The login form has to stay reachable without a session.
        - { host: '^%env(CMS_HOST)%$', path: '^/login', roles: PUBLIC_ACCESS }
        # Everything served by the CMS context requires an authenticated admin.
        - { host: '^%env(CMS_HOST)%$', roles: ROLE_CMS_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
