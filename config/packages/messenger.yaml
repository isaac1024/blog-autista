framework:
    messenger:
        # Messages that keep failing after their retries wait here, to be
        # inspected and retried with messenger:failed:show / messenger:failed:retry.
        failure_transport: failed

        transports:
            # Domain events, consumed by cron with messenger:consume async.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # A Doctrine transport option: how long a message taken by a
                    # worker that died stays held before it is delivered again.
                    redeliver_timeout: '%env(int:MESSENGER_REDELIVER_TIMEOUT)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            'Shared\Infrastructure\Event\DomainEventMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
