doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            cms_page_id: Cms\Page\Infrastructure\Persistence\Doctrine\PageIdType
        # Native UUID columns (see Shared\Infrastructure\Persistence\Doctrine\UuidType)
        # have to map to a Doctrine type when the schema is introspected. Any
        # UuidType declares the same "UUID" column, so the schema comparison
        # works for every identifier whichever one is named here.
        mapping_types:
            uuid: cms_page_id
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        dql:
            numeric_functions:
                MATCH_AGAINST: Shared\Infrastructure\Persistence\Doctrine\MatchAgainstFunction
        mappings:
            Web:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Entity'
                prefix: 'Web\Entity'
            Cms:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Entity'
                prefix: 'Cms\Entity'
            CmsPage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Page/Domain'
                prefix: 'Cms\Page\Domain'
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Entity'
                prefix: 'Shared\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
