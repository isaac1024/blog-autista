doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # Every table names its character set and collation, whatever the
        # server defaults to (Hetzner's server says utf8mb3): full Unicode,
        # compared without accents or case, so "sueno" finds "sueño".
        default_table_options:
            charset: utf8mb4
            collation: utf8mb4_uca1400_ai_ci
        types:
            cms_author_id: Cms\Author\Infrastructure\Persistence\Doctrine\AuthorIdType
            cms_author_avatar: Cms\Author\Infrastructure\Persistence\Doctrine\AvatarType
            cms_author_version: Cms\Author\Infrastructure\Persistence\Doctrine\AuthorVersionType
            cms_external_resource_id: Cms\External\Infrastructure\Persistence\Doctrine\ExternalResourceIdType
            cms_external_resource_version: Cms\External\Infrastructure\Persistence\Doctrine\ResourceVersionType
            cms_image_id: Cms\Image\Infrastructure\Persistence\Doctrine\ImageIdType
            cms_image_version: Cms\Image\Infrastructure\Persistence\Doctrine\ImageVersionType
            cms_page_id: Cms\Page\Infrastructure\Persistence\Doctrine\PageIdType
            cms_post_id: Cms\Post\Infrastructure\Persistence\Doctrine\PostIdType
            cms_post_image_id: Cms\Post\Infrastructure\Persistence\Doctrine\ImageIdType
            cms_post_author_id: Cms\Post\Infrastructure\Persistence\Doctrine\AuthorIdType
            cms_post_section_id: Cms\Post\Infrastructure\Persistence\Doctrine\SectionIdType
            cms_post_tag_ids: Cms\Post\Infrastructure\Persistence\Doctrine\TagIdsType
            cms_post_version: Cms\Post\Infrastructure\Persistence\Doctrine\PostVersionType
            cms_redirect_id: Cms\Redirect\Infrastructure\Persistence\Doctrine\RedirectIdType
            cms_relation_id: Cms\Relation\Infrastructure\Persistence\Doctrine\RelationIdType
            cms_settings_author_id: Cms\Settings\Infrastructure\Persistence\Doctrine\AuthorIdType
            cms_settings_id: Cms\Settings\Infrastructure\Persistence\Doctrine\SettingsIdType
            cms_settings_image_id: Cms\Settings\Infrastructure\Persistence\Doctrine\ImageIdType
            cms_settings_menu: Cms\Settings\Infrastructure\Persistence\Doctrine\MenuType
            cms_settings_version: Cms\Settings\Infrastructure\Persistence\Doctrine\SettingsVersionType
            cms_term_id: Cms\Taxonomy\Infrastructure\Persistence\Doctrine\TermIdType
            cms_term_version: Cms\Taxonomy\Infrastructure\Persistence\Doctrine\TermVersionType
            cms_slug: Cms\Shared\Infrastructure\Persistence\Doctrine\SlugType
            cms_page_version: Cms\Page\Infrastructure\Persistence\Doctrine\PageVersionType
            rich_text: Shared\Infrastructure\Persistence\Doctrine\RichTextType
            uuid_text: Shared\Infrastructure\Persistence\Doctrine\UuidTextType
            web_author_id: Web\Author\Infrastructure\Persistence\Doctrine\AuthorIdType
            web_external_resource_id: Web\External\Infrastructure\Persistence\Doctrine\ExternalResourceIdType
            web_image_id: Web\Image\Infrastructure\Persistence\Doctrine\ImageIdType
            web_visit_id: Web\Analytics\Infrastructure\Persistence\Doctrine\VisitIdType
            web_page_id: Web\Page\Infrastructure\Persistence\Doctrine\PageIdType
            web_post_id: Web\Post\Infrastructure\Persistence\Doctrine\PostIdType
            web_term_id: Web\Taxonomy\Infrastructure\Persistence\Doctrine\TermIdType
            web_settings_id: Web\Settings\Infrastructure\Persistence\Doctrine\SettingsIdType
        # Native UUID columns (see Shared\Infrastructure\Persistence\Doctrine\UuidType)
        # have to map to a Doctrine type when the schema is introspected. Any
        # UuidType declares the same "UUID" column, so the schema comparison
        # works for every identifier whichever one is named here.
        mapping_types:
            uuid: cms_page_id
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        dql:
            numeric_functions:
                MATCH_AGAINST: Shared\Infrastructure\Persistence\Doctrine\MatchAgainstFunction
        mappings:
            CmsAuthor:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Author/Domain'
                prefix: 'Cms\Author\Domain'
            CmsExternal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/External/Domain'
                prefix: 'Cms\External\Domain'
            CmsImage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Image/Domain'
                prefix: 'Cms\Image\Domain'
            CmsRedirect:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Redirect/Domain'
                prefix: 'Cms\Redirect\Domain'
            CmsRelation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Relation/Domain'
                prefix: 'Cms\Relation\Domain'
            CmsPage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Page/Domain'
                prefix: 'Cms\Page\Domain'
            CmsPost:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Post/Domain'
                prefix: 'Cms\Post\Domain'
            CmsTaxonomy:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Taxonomy/Domain'
                prefix: 'Cms\Taxonomy\Domain'
            CmsShared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Shared/Domain'
                prefix: 'Cms\Shared\Domain'
            CmsSettings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Cms/Settings/Domain'
                prefix: 'Cms\Settings\Domain'
            WebAnalytics:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Analytics/Domain'
                prefix: 'Web\Analytics\Domain'
            WebAuthor:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Author/Domain'
                prefix: 'Web\Author\Domain'
            WebExternal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/External/Domain'
                prefix: 'Web\External\Domain'
            WebImage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Image/Domain'
                prefix: 'Web\Image\Domain'
            WebPage:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Page/Domain'
                prefix: 'Web\Page\Domain'
            WebPost:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Post/Domain'
                prefix: 'Web\Post\Domain'
            # The index of the posts of each tag, which the repository of the
            # posts keeps; the domain never sees it.
            WebPostIndex:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Post/Infrastructure/Persistence/Index'
                prefix: 'Web\Post\Infrastructure\Persistence\Index'
            WebSitemap:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Sitemap/Domain'
                prefix: 'Web\Sitemap\Domain'
            WebSettings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Settings/Domain'
                prefix: 'Web\Settings\Domain'
            WebTaxonomy:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Taxonomy/Domain'
                prefix: 'Web\Taxonomy\Domain'
            WebShared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Web/Shared/Domain'
                prefix: 'Web\Shared\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
