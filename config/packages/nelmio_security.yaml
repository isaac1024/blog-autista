nelmio_security:
    # prevents framing of the entire site
    clickjacking:
        paths:
            '^/.*': DENY

    # disables content type sniffing for script resources
    content_type:
        nosniff: true

    # Send a full URL in the `Referer` header when performing a same-origin request,
    # only send the origin of the document to secure destination (HTTPS->HTTPS),
    # and send no header to a less secure destination (HTTPS->HTTP).
    # If `strict-origin-when-cross-origin` is not supported, use `no-referrer` policy,
    # no referrer information is sent along with requests.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Neither host uses the camera, the microphone, the location of the reader,
    # payments nor USB devices, nor lets a frame of another site ask for them;
    # what the frames of the widgets ask, such as fullscreen, stays theirs.
    permissions_policy:
        enabled: true
        policies:
            camera: []
            microphone: []
            geolocation: []
            payment: []
            usb: []

    # A page opened from another site, or that opens one, never reaches the
    # other's window: neither host needs window.opener, nor do the widgets.
    cross_origin_isolation:
        enabled: true
        paths:
            '^/':
                coop: 'same-origin'

    # Only the site's own code runs. The CMS's import map, its one inline
    # script, carries the nonce of the request; the public site has none, so
    # its policy is the same on every page and Varnish caches it as it is.
    csp:
        # X-Content-Security-Policy is for browsers long gone.
        compat_headers: false
        enforce:
            level1_fallback: false
            default-src: ["'self'"]
            script-src: ["'self'"]
            style-src: ["'self'"]
            # Thumbnails come from the CMS; the cropper shows the file chosen as a blob.
            img-src: ["'self'", 'data:', 'blob:']
            font-src: ["'self'"]
            connect-src: ["'self'"]
            object-src: ["'none'"]
            base-uri: ["'none'"]
            form-action: ["'self'"]
            frame-ancestors: ["'none'"]

# Behind the nginx of Hetzner, which ends TLS, a visit by http:// is sent to
# https://, and browsers are told to come back by https:// alone for a year:
# the first visit by a link of old, or an address typed by hand, can't be
# read nor downgraded on the way, the session of the CMS above all. Only
# the hosts of the site and the CMS, not every subdomain, and never
# preloaded, which can't be undone. Symfony trusts the X-Forwarded-Proto of
# the proxy, so the redirect never loops. Permanent, as Hetzner's own
# redirect once the domain has a certificate, which comes first.
when@prod:
    nelmio_security:
        forced_ssl:
            enabled: true
            redirect_status_code: 301
            hsts_max_age: 31536000
            hsts_subdomains: false
            hsts_preload: false
