framework:
    rate_limiter:
        # The visits one address may send the site in a minute: far more than
        # anyone reads, few enough to keep the counts from being flooded.
        # Readers behind the same address (a NAT, an office) share it, and a
        # client that is no browser can still forge visits within it: the
        # counts are only as true as those who send them.
        web_visit:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            cache_pool: web.visit_limiter.cache
        # The searches of the site one address may ask in a minute, of those
        # the page cache doesn't answer: more than anyone reading searches,
        # few enough that a bot sweeping words can't take every PHP process,
        # each search holding one up to its time limit.
        web_search:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
            cache_pool: web.search_limiter.cache
        # The wrong HTTP passwords of the CMS one address may give in a
        # quarter of an hour: past them it is refused without checking, as a
        # hash is slow to check on purpose and a bot would take every PHP
        # process trying words.
        cms_gate:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
            cache_pool: cms.gate_limiter.cache
