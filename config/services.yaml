# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where the files of the images uploaded to the CMS are kept, out of public/.
    cms.image.storage_directory: '%kernel.project_dir%/media'
    # The small copies the CMS shows of them in its lists and pickers, made
    # the first time one is asked for, so they can always be made again.
    cms.image.thumbnail_directory: '%kernel.project_dir%/var/thumbnails'
    # The site makes its copies of the images the CMS publishes from those
    # files, and keeps them in its public directory, apart from them.
    web.image.originals_directory: '%cms.image.storage_directory%'
    web.image.public_directory: '%kernel.project_dir%/public/media'
    # Where the avatars of the authors are kept, out of public/, apart from
    # the images; the site makes their copies under its public media.
    cms.author.avatar_directory: '%kernel.project_dir%/media/avatars'
    web.author.originals_directory: '%cms.author.avatar_directory%'
    web.author.public_directory: '%web.image.public_directory%/autores'
    # Where the CMS keeps the images it reads of the external resources, out
    # of public/; the site makes their copies under its public media.
    cms.external.image_directory: '%kernel.project_dir%/media/externos'
    web.external.originals_directory: '%cms.external.image_directory%'
    web.external.public_directory: '%web.image.public_directory%/externos'
    # The seconds a search of the site may take: a word most posts are about
    # takes longer as they grow, and is asked to be narrowed rather than
    # holding a PHP process, of the 10 the hosting has.
    web.post.search_time_limit: 1.5

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Each context is an independent root namespace; services are discovered
    # per context, never behind a shared App\ prefix.
    Web\:
        resource: '../src/Web/'

    Cms\:
        resource: '../src/Cms/'

    Shared\:
        resource: '../src/Shared/'

    # Other sites are read only over the public network, whatever an address
    # or a redirect names, so nothing pasted makes the server read itself or
    # its neighbours. It is a service of its own, as no attribute can build a
    # decorator of the framework's client; the tests answer for the sites in
    # its place.
    shared.public_network_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        shared.public_network_client:
            alias: http_client
        # Answers for the sites the tests read, as each test records them.
        Shared\Tests\Infrastructure\Http\RecordedSites: ~
        # The addresses the page cache is told to forget, as each test reads them.
        Shared\Domain\PageCache:
            class: Shared\Tests\Infrastructure\Http\ForgottenPages

    parameters:
        # Tests keep their files apart from the real ones, one directory per
        # parallel process, as they do with their databases.
        cms.image.storage_directory: '%kernel.project_dir%/var/test/media%env(default::TEST_TOKEN)%'
        cms.image.thumbnail_directory: '%kernel.project_dir%/var/test/thumbnails%env(default::TEST_TOKEN)%'
        web.image.public_directory: '%kernel.project_dir%/var/test/public-media%env(default::TEST_TOKEN)%'
        cms.author.avatar_directory: '%kernel.project_dir%/var/test/avatars%env(default::TEST_TOKEN)%'
        cms.external.image_directory: '%kernel.project_dir%/var/test/externals%env(default::TEST_TOKEN)%'
