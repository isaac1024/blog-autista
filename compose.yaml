# Local parity for Hetzner Webhosting L.
#
# This mirrors the shared-hosting stack, it is NOT a deployment target:
# Webhosting L is shared hosting, so there is no Docker (and no root) in
# production. The same code is uploaded over SSH/FTP and served by Hetzner's
# own nginx -> Apache -> PHP-FPM chain.
#
#   edge (nginx)  ->  apache 2.4.69  ->  php-fpm 8.5  (10 workers, 384 MB each)
#                                      database: mariadb 11.8
#                                      cache:    redis
#
# Usage:
#   docker compose up -d --build
#   docker compose exec -u www-data php bin/console about
#   docker compose run --rm -u www-data php composer require <package>
#
name: blog-autista

services:
  # Hetzner fronts Apache with nginx (HTTP/2 and HTTP/3). Locally we only keep
  # the proxying layer; TLS terminates at the edge in production.
  edge:
    image: nginx:stable-alpine
    depends_on:
      - apache
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app
    restart: unless-stopped

  # Apache 2.4.69 + .htaccess, as on the hosting account.
  apache:
    image: httpd:2.4.69
    depends_on:
      - php
    volumes:
      # Application files are read-only for the web server.
      - .:/var/www/html:ro
      - ./docker/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - app
    restart: unless-stopped

  # PHP-FPM 8.5, the version set in konsoleH -> Services -> PHP configuration.
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        # Match the developer UID/GID so cache/log files stay writable
        # from both the host and the container.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DEFAULT_URI: "${DEFAULT_URI}"
      # Credentials are local-only; production values live in .env.local
      # (or the secrets vault) on the hosting account.
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro
      - ./docker/php/zzz-app-fpm.conf:/usr/local/etc/php-fpm.d/zzz-app-fpm.conf:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  # Consumes the domain events queued by the application, such as the CMS
  # publishing a page, so the site follows without running the consumer by
  # hand. Production runs the same command from cron. It stops every hour, or
  # when it grows too big, and Docker starts it again with fresh code.
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: www-data
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      # Editing code rebuilds the dev cache, which can kill the worker mid
      # message; this delivers that message again within a minute, not an hour.
      MESSENGER_REDELIVER_TIMEOUT: "60"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-app.ini:ro
    depends_on:
      database:
        condition: service_healthy
      php:
        condition: service_started
    networks:
      - app
    restart: unless-stopped

  # Webhosting L was migrated from MariaDB 10.11 to 11.8.
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-app}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
    restart: unless-stopped

  # Redis is included in Webhosting L (from Webhosting XL onwards in older
  # plan naming; the current L page lists it).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - app
    restart: unless-stopped

volumes:
  db-data:
  redis-data:

networks:
  app:
