            trigger: 'Unpublish'
            title: 'Unpublish this page?'
            description: 'The page “%title%” will be taken off the site and its address will stop working. You can publish it again.'
            submit: 'Yes, unpublish the page'
        status:
            draft:
                label: 'Draft'
                description: 'Draft: not on the site yet.'
            published:
                label: 'Published'
                description: 'Published: the site shows this version.'
            changed:
                label: 'Published with changes'
