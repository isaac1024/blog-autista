        title: 'Pages'
        subtitle: 'Pages are the fixed content of the blog, like “About me” or “Contact”.'
        empty:
            title: 'There are no pages yet'
            message: 'When you create a page, it will appear here.'
            action: 'Create the first page'
        search:
            label: 'Search by title'
            submit: 'Search'
            empty:
                title: 'No results'
                message: 'No page has “%title%” in its title.'
                action: 'See all pages'
        edit:
            title: 'Edit page'
            title_label: 'Title'
            home_address: 'The home page is served at the root of the site (/), so it has no address of its own.'
            content_title: 'Content'
            content_placeholder: 'Write the content of the page here…'
            slug_label: 'Web address (slug)'
            slug_hint: 'Only lowercase letters without accents, numbers and hyphens. For example: about-me.'
            submit: 'Save'
            publish: 'Publish'
            republish: 'Republish'
            seo:
                title: 'Search engines'
                description: 'How the page shows in Google and other search engines. The title of the result is the title of the page.'
                preview: 'Result preview'
                preview_empty: 'No meta description: the search engine will show the excerpt of the text it picks.'
                meta_description_label: 'Meta description'
                meta_description_hint: 'The summary under the title in the results: one or two sentences that tell what the page holds.'
                robots_legend: 'Visibility in search engines'
                robots:
                    'index,follow':
                        label: 'Show in search engines'
                        hint: 'The page may appear in the results and its links are followed. This is the usual choice.'
                    'noindex,follow':
                        label: 'Do not show, but follow its links'
                        hint: 'It does not appear in the results, but search engines discover the pages it links to. Right for the internal search page.'
                    'noindex,nofollow':
                        label: 'Hide entirely'
                        hint: 'It neither appears in the results nor are its links followed.'
        discard:
            trigger: 'Discard changes'
            title: 'Discard the changes?'
            description: 'The page “%title%” will go back to the version published on the site. The changes saved since then will be lost. This cannot be undone.'
            submit: 'Yes, discard the changes'
        unpublish:
            trigger: 'Unpublish'
            title: 'Unpublish this page?'
            description: 'The page “%title%” will be taken off the site and its address will stop working. You can publish it again.'
            submit: 'Yes, unpublish the page'
        status:
            draft:
                label: 'Draft'
                description: 'Draft: not on the site yet.'
            published:
                label: 'Published'
                description: 'Published: the site shows this version.'
            changed:
                label: 'Published with changes'
                description: 'Published with changes: the site shows the previous version until you republish.'
            unpublished:
                label: 'Unpublished'
                description: 'Unpublished: no longer on the site.'
        delete:
            trigger: 'Delete page'
            title: 'Delete this page?'
            description: 'The page “%title%” and its web address will no longer exist. This cannot be undone.'
            submit: 'Yes, delete the page'
        types:
            home: 'Home page'
            contact: 'Contact'
            search: 'Search'
            legal_notice: 'Legal notice'
            privacy_policy: 'Privacy policy'
            cookie_policy: 'Cookie policy'
        list:
