                not_found:
                    label: 'Let it not be found'
                    hint: 'The site will say it can’t find the address (404). You can create a redirect later.'
            incoming:
                title: 'Redirects that lead here'
                description: 'Addresses that lead to this content: %count%. As redirects only lead to published content, decide what each one does.'
