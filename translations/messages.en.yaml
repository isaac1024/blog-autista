            subtitle: 'Publishing it changes the redirects of the blog. Check what will happen before publishing it.'
            replaced: 'Publishing it deletes the redirect of %address%, which now leads to: %target%. That address will show this page.'
            replaced_origin: 'Publishing it deletes the redirect of %address%, which now leads to: %target%. That address will show this page, and what links to or embeds this content will stop showing it: %origin%.'
