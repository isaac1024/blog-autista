                title: 'Its former address'
                description: 'It was at %previous% and will be at %next%.'
                legend: 'What %previous% does once it is published'
                itself:
                    label: 'Lead to this page'
                    hint: 'Whoever comes by the former address sees the page at its new one.'
                keep:
                    label: 'Leave its redirect as it is'
                    hint: 'It already leads to: %target%.'
                keep_none:
                    label: 'Let it not be found'
                    hint: 'The site will say it can’t find the former address (404).'
        last_address:
            title: 'Its last address'
            not_found: 'It was at %address%, which now leads nowhere: the site says it can’t find it.'
            redirected: 'It was at %address%, which now leads to: %target%.'
