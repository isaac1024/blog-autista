# Minimal Apache 2.4.69 configuration matching the Hetzner shared-hosting model:
# the document root is the Symfony public/ directory, .htaccess is honoured and
# PHP is executed by the separate PHP-FPM 8.5 container (never mod_php).
ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

User daemon
Group daemon

ServerTokens Prod
ServerSignature Off
HostnameLookups Off

ErrorLog /proc/self/fd/2
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

TypesConfig conf/mime.types
DirectoryIndex index.php index.html

DocumentRoot "/var/www/html/public"

<Directory "/var/www/html/public">
    Options -Indexes +FollowSymLinks
    # Hetzner lets you ship .htaccess; the Symfony apache-pack rules live there.
    AllowOverride All
    Require all granted
    # Front controller for anything that is not a real file (mirrors the
    # rewrite that apache-pack installs).
    FallbackResource /index.php
</Directory>

# Never serve application code, .env files or vendor/ over HTTP.
<Directory "/var/www/html">
    Require all denied
</Directory>

# Originals live out of public/ and go through the authenticated CMS.
# Only published copies are public files, under public/media/.

ProxyRequests Off
ProxyTimeout 60

# Execute PHP through PHP-FPM, preserving the /index.php/... path info.
ProxyPassMatch "^/(.*\.php(/.*)?)$" "fcgi://php:9000/var/www/html/public/$1"
