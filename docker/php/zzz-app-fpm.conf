; Webhosting L gives each account 10 PHP processes, so cap the pool at 10
; workers. Each worker is bounded by memory_limit = 384M (see php.ini).
[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; The container is the source of APP_ENV / DATABASE_URL / REDIS_URL.
clear_env = no
catch_workers_output = yes

; Log to the container output, like the managed service does.
access.log = /proc/self/fd/2
