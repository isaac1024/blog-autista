; Mirrors the limits of Hetzner Webhosting L (per PHP process).
; https://www.hetzner.com/webhosting/ -> Webhosting L
memory_limit = 384M

; konsoleH exposes these as account-level settings.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_time = 60

; Webhosting L ships OPcache (and optionally APCu/Xdebug) as account extensions.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Development: pick up code changes without restarting FPM.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = UTC
expose_php = Off
